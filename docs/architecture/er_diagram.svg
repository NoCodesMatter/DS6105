<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1190" viewBox="0 0 1700 1190" role="img">
<title>Logical relational schema, contract 1.0.0</title>
<rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="40" y="43" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1b2d45" text-anchor="start">HDB resale and hawker centres - logical relational schema</text>
<text x="40" y="78" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#1b2d45" text-anchor="start">Contract 1.0.0 | six base tables mapped from the conceptual ER | 3NF; BCNF subject to pending FD checks</text>
<polyline points="380,248 540,248" fill="none" stroke="#667a94" stroke-width="3"/>
<text x="392" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(0,N)</text>
<text x="475" y="278" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(1,1)</text>
<text x="397" y="309" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1b2d45" text-anchor="start">LOCATED IN</text>
<polyline points="1040,248 1180,248" fill="none" stroke="#667a94" stroke-width="3"/>
<text x="1048" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(0,N)</text>
<text x="1115" y="278" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(1,1)</text>
<text x="1052" y="309" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1b2d45" text-anchor="start">IN BUILDING</text>
<polyline points="1420,520 1420,680" fill="none" stroke="#667a94" stroke-width="3"/>
<text x="1434" y="552" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(0,N)</text>
<text x="1434" y="659" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(1,1)</text>
<text x="1310" y="604" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1b2d45" text-anchor="start">SOLD AS</text>
<polyline points="790,430 790,730" fill="none" stroke="#667a94" stroke-width="3"/>
<text x="805" y="465" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(0,N)</text>
<text x="805" y="710" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(1,1)</text>
<text x="600" y="585" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1b2d45" text-anchor="start">IS NEAR (M:N)</text>
<polyline points="380,830 540,830" fill="none" stroke="#667a94" stroke-width="3"/>
<text x="392" y="810" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(0,N)</text>
<text x="475" y="860" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1b2d45" text-anchor="start">(1,1)</text>
<text x="395" y="891" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1b2d45" text-anchor="start">IS NEAR</text>
<rect x="40" y="180" width="340" height="135" rx="12" fill="white" stroke="#8fa2ba" stroke-width="2"/>
<rect x="41" y="181" width="338" height="52" rx="11" fill="#17375c"/>
<text x="58" y="215" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="start">town</text>
<text x="58" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK town_name</text>
<rect x="540" y="120" width="500" height="310" rx="12" fill="white" stroke="#8fa2ba" stroke-width="2"/>
<rect x="541" y="121" width="498" height="52" rx="11" fill="#17375c"/>
<text x="558" y="155" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="start">hdb_building</text>
<text x="558" y="204" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK building_id</text>
<text x="558" y="232" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">FK town_name -&gt; town</text>
<text x="558" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">block</text>
<text x="558" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">street_name</text>
<text x="558" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">latitude ?</text>
<text x="558" y="344" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">longitude ?</text>
<text x="558" y="412" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">UQ (block, street_name)</text>
<rect x="1180" y="120" width="480" height="400" rx="12" fill="white" stroke="#8fa2ba" stroke-width="2"/>
<rect x="1181" y="121" width="478" height="52" rx="11" fill="#17375c"/>
<text x="1198" y="155" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="start">hdb_flat (observed profile)</text>
<text x="1198" y="204" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK flat_id</text>
<text x="1198" y="232" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">FK building_id -&gt; hdb_building</text>
<text x="1198" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">flat_type</text>
<text x="1198" y="288" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">storey_lower, storey_upper</text>
<text x="1198" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">floor_area_sqm</text>
<text x="1198" y="344" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">flat_model</text>
<text x="1198" y="372" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">lease_commence_year</text>
<text x="1198" y="454" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">UQ (building_id, flat_type, storey_lower,</text>
<text x="1198" y="478" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">storey_upper, floor_area_sqm,</text>
<text x="1198" y="502" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">flat_model, lease_commence_year)</text>
<rect x="1180" y="680" width="480" height="345" rx="12" fill="white" stroke="#8fa2ba" stroke-width="2"/>
<rect x="1181" y="681" width="478" height="52" rx="11" fill="#17375c"/>
<text x="1198" y="715" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="start">resale_transaction</text>
<text x="1198" y="764" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK transaction_id</text>
<text x="1198" y="792" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">FK flat_id -&gt; hdb_flat</text>
<text x="1198" y="820" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">sale_month</text>
<text x="1198" y="848" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">resale_price</text>
<text x="1198" y="876" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">remaining_lease_months ?</text>
<text x="1198" y="904" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">lease_basis</text>
<text x="1198" y="932" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">source_dataset, source_row</text>
<text x="1198" y="1007" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">UQ (source_dataset, source_row)</text>
<rect x="40" y="680" width="340" height="330" rx="12" fill="white" stroke="#8fa2ba" stroke-width="2"/>
<rect x="41" y="681" width="338" height="52" rx="11" fill="#17375c"/>
<text x="58" y="715" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="start">hawker_centre</text>
<text x="58" y="764" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK hawker_id</text>
<text x="58" y="792" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">centre_name</text>
<text x="58" y="820" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">address</text>
<text x="58" y="848" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">market_produce_stalls</text>
<text x="58" y="876" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">latitude ?</text>
<text x="58" y="904" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">longitude ?</text>
<text x="58" y="992" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">UQ (centre_name, address)</text>
<rect x="540" y="730" width="500" height="235" rx="12" fill="white" stroke="#8fa2ba" stroke-width="2"/>
<rect x="541" y="731" width="498" height="52" rx="11" fill="#17375c"/>
<text x="558" y="765" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="start">building_hawker (IS NEAR)</text>
<text x="558" y="814" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK/FK building_id -&gt; hdb_building</text>
<text x="558" y="842" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK/FK hawker_id -&gt; hawker_centre</text>
<text x="558" y="870" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">distance_m</text>
<text x="558" y="898" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">~ proximity_class (view, not stored)</text>
<text x="558" y="947" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53677f" text-anchor="start">Composite PK (building_id, hawker_id)</text>
<text x="40" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1b2d45" text-anchor="start">(1,1) = each row has one NOT NULL FK; (0,N) = a referenced row may have any number. ? = nullable; never (0,0).</text>
<text x="40" y="1104" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">proximity_class() and views building_hawker_proximity / nearest_hawker / nearest_market_hawker are derived, not stored.</text>
<text x="40" y="1137" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">The M:N relationship IS NEAR becomes the associative table building_hawker; each 1:N becomes a NOT NULL FK.</text>
<text x="40" y="1170" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1b2d45" text-anchor="start">PK = primary key; FK = foreign key; UQ = alternate key. Precise types and CHECK constraints are in db/schema/001_schema.sql.</text>
</svg>
